<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Trois propositions de logo BOO-P avec un livre fermé</title>
  <desc id="desc">Comparaison de trois directions sobres et sereines : Le Signet, Le Sentier et L’Empreinte.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#0F1B2D" flood-opacity=".08"/>
    </filter>
    <clipPath id="mask1"><rect width="332" height="332" rx="76"/></clipPath>
  </defs>

  <rect width="1800" height="1280" fill="#F2EDE3"/>
  <circle cx="1700" cy="-60" r="340" fill="#6D8F7A" opacity=".07"/>
  <circle cx="-40" cy="1280" r="310" fill="#D28B3D" opacity=".06"/>

  <text x="84" y="88" fill="#6D8F7A" font-family="Poppins, Segoe UI, sans-serif" font-size="21" font-weight="600" letter-spacing="4">BOO-P · EXPLORATION 02</text>
  <text x="84" y="154" fill="#0F1B2D" font-family="Playfair Display, Georgia, serif" font-size="62" font-weight="600">Le livre fermé, trois caractères</text>
  <text x="84" y="202" fill="#0F1B2D" opacity=".6" font-family="Poppins, Segoe UI, sans-serif" font-size="20">Même histoire de marque. Trois niveaux de présence, du plus familier au plus distinctif.</text>

  <!-- Card 1 -->
  <g transform="translate(70 262)">
    <rect width="520" height="894" rx="38" fill="#FEF9EF" filter="url(#shadow)"/>
    <text x="42" y="64" fill="#6D8F7A" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="3">01 · FAMILIER</text>
    <g transform="translate(94 102)" clip-path="url(#mask1)">
      <rect width="332" height="332" fill="#0F1B2D"/>
      <rect x="99" y="54" width="154" height="224" rx="18" fill="#6D8F7A" opacity=".38"/>
      <rect x="79" y="43" width="158" height="222" rx="18" fill="#F2EDE3"/>
      <path d="M113 50V258" stroke="#0F1B2D" stroke-width="8" opacity=".12"/>
      <path d="M136 170C154 150 176 148 196 164C208 174 216 176 226 172" fill="none" stroke="#6D8F7A" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 22"/>
      <path d="M178 245H204V296L191 285L178 296V245Z" fill="#D28B3D"/>
    </g>
    <text x="42" y="498" fill="#0F1B2D" font-family="Playfair Display, Georgia, serif" font-size="38" font-weight="600">Le Signet</text>
    <text x="42" y="538" fill="#0F1B2D" opacity=".58" font-family="Poppins, Segoe UI, sans-serif" font-size="16">Clair · chaleureux · immédiatement lisible</text>
    <g font-family="Poppins, Segoe UI, sans-serif" font-size="67" font-weight="700" letter-spacing="-3">
      <text x="42" y="658" fill="#0F1B2D">BOO</text>
      <text x="244" y="658" fill="#6D8F7A" letter-spacing="0">–</text>
      <text x="319" y="658" fill="#0F1B2D">P</text>
    </g>
    <text x="44" y="704" fill="#0F1B2D" opacity=".66" font-family="Playfair Display, Georgia, serif" font-size="22" font-style="italic">Chaque lecture laisse une trace.</text>
    <line x1="42" y1="758" x2="478" y2="758" stroke="#0F1B2D" stroke-opacity=".09"/>
    <text x="42" y="802" fill="#0F1B2D" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600">Force</text>
    <text x="42" y="835" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">Rassure et explique l’univers</text>
    <text x="42" y="861" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">de BOO-P au premier regard.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(640 262)">
    <rect width="520" height="894" rx="38" fill="#FEF9EF" filter="url(#shadow)"/>
    <text x="42" y="64" fill="#6D8F7A" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="3">02 · PAISIBLE</text>
    <g transform="translate(94 102)" clip-path="url(#mask1)">
      <rect width="332" height="332" fill="#0F1B2D"/>
      <path d="M61 104H242C259 104 272 117 272 134V144H87C73 144 61 133 61 119V104Z" fill="#6D8F7A"/>
      <path d="M74 131H256C265 131 272 138 272 147V213C272 223 264 231 254 231H88C73 231 61 219 61 204V144C61 137 67 131 74 131Z" fill="#F2EDE3"/>
      <path d="M103 140V222" stroke="#0F1B2D" stroke-width="8" opacity=".13"/>
      <path d="M126 182C155 168 181 170 203 183C223 196 244 196 266 182" fill="none" stroke="#6D8F7A" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 22"/>
      <path d="M205 223H231V279L218 268L205 279V223Z" fill="#D28B3D"/>
    </g>
    <text x="42" y="498" fill="#0F1B2D" font-family="Playfair Display, Georgia, serif" font-size="38" font-weight="600">Le Sentier</text>
    <text x="42" y="538" fill="#0F1B2D" opacity=".58" font-family="Poppins, Segoe UI, sans-serif" font-size="16">Stable · horizontal · contemplatif</text>
    <g font-family="Poppins, Segoe UI, sans-serif" font-size="62" font-weight="600" letter-spacing="3">
      <text x="42" y="656" fill="#0F1B2D">BOO</text>
      <text x="252" y="656" fill="#6D8F7A" letter-spacing="0">–</text>
      <text x="328" y="656" fill="#0F1B2D">P</text>
    </g>
    <text x="44" y="704" fill="#0F1B2D" opacity=".66" font-family="Playfair Display, Georgia, serif" font-size="22" font-style="italic">Chaque lecture laisse une trace.</text>
    <line x1="42" y1="758" x2="478" y2="758" stroke="#0F1B2D" stroke-opacity=".09"/>
    <text x="42" y="802" fill="#0F1B2D" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600">Force</text>
    <text x="42" y="835" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">La ligne horizontale évoque le calme,</text>
    <text x="42" y="861" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">le temps long et la lecture posée.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1210 262)">
    <rect width="520" height="894" rx="38" fill="#FEF9EF" filter="url(#shadow)"/>
    <text x="42" y="64" fill="#6D8F7A" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="3">03 · DISTINCTIF</text>
    <g transform="translate(94 102)" clip-path="url(#mask1)">
      <rect width="332" height="332" fill="#0F1B2D"/>
      <rect x="77" y="49" width="178" height="234" rx="20" fill="none" stroke="#F2EDE3" stroke-width="11"/>
      <path d="M114 55V277" stroke="#F2EDE3" stroke-width="8" opacity=".42"/>
      <path d="M153 224V122H193C218 122 233 135 233 155C233 176 218 189 193 189H153" fill="none" stroke="#6D8F7A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M210 44H234V94L222 85L210 94V44Z" fill="#D28B3D"/>
    </g>
    <text x="42" y="498" fill="#0F1B2D" font-family="Playfair Display, Georgia, serif" font-size="38" font-weight="600">L’Empreinte</text>
    <text x="42" y="538" fill="#0F1B2D" opacity=".58" font-family="Poppins, Segoe UI, sans-serif" font-size="16">Éditorial · minimal · propriétaire</text>
    <g font-family="Playfair Display, Georgia, serif" font-size="70" font-weight="600" letter-spacing="1">
      <text x="42" y="660" fill="#0F1B2D">BOO</text>
      <text x="249" y="660" fill="#6D8F7A">–</text>
      <text x="333" y="660" fill="#0F1B2D">P</text>
    </g>
    <text x="44" y="704" fill="#0F1B2D" opacity=".66" font-family="Playfair Display, Georgia, serif" font-size="22" font-style="italic">Chaque lecture laisse une trace.</text>
    <line x1="42" y1="758" x2="478" y2="758" stroke="#0F1B2D" stroke-opacity=".09"/>
    <text x="42" y="802" fill="#0F1B2D" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="600">Force</text>
    <text x="42" y="835" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">La trace dessine un P discret :</text>
    <text x="42" y="861" fill="#0F1B2D" opacity=".62" font-family="Poppins, Segoe UI, sans-serif" font-size="16">une signature unique à la marque.</text>
  </g>

  <text x="84" y="1230" fill="#0F1B2D" opacity=".52" font-family="Poppins, Segoe UI, sans-serif" font-size="17">Palette conservée : Bleu nuit #0F1B2D · Sauge #6D8F7A · Ocre #D28B3D · Crème #F2EDE3</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BOO-P — proposition 3, L’Empreinte</title>
  <desc id="desc">Le contour minimal d’un livre fermé dont la trace dessine discrètement la lettre P.</desc>
  <rect width="1024" height="1024" fill="#0F1B2D"/>

  <!-- Livre fermé réduit à sa reliure -->
  <rect x="238" y="154" width="548" height="716" rx="62" fill="none" stroke="#F2EDE3" stroke-width="34"/>
  <path d="M350 174V850" fill="none" stroke="#F2EDE3" stroke-width="25" opacity=".42"/>
  <path d="M762 218V806C762 828 744 846 722 846H286" fill="none" stroke="#F2EDE3" stroke-width="16" stroke-linecap="round" opacity=".2"/>

  <!-- La trace forme un P discret -->
  <path d="M470 690V378H594C670 378 716 418 716 480C716 544 670 584 594 584H470" fill="none" stroke="#6D8F7A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signet court, presque un sceau -->
  <path d="M646 138H718V288L682 260L646 288V138Z" fill="#D28B3D"/>
</svg>

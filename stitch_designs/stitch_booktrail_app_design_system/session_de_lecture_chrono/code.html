<!-- Simple script for tactile feedback simulation on the slider (visual only for this demo) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dial = document.querySelector('.cursor-ew-resize');
            const pageNumber = document.querySelector('.text-headline-md');
            let isDragging = false;
            let startX;
            let currentPage = 142;

            dial.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.pageX;
                dial.classList.add('cursor-grabbing');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const diff = e.pageX - startX;
                if (Math.abs(diff) > 10) {
                    // Simulate page changing
                    currentPage += diff > 0 ? 1 : -1;
                    pageNumber.textContent = Math.max(1, currentPage); // Prevent negative pages
                    startX = e.pageX; // Reset start for continuous drag
                    // Haptic feedback could be triggered here via navigator.vibrate(5)
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                dial.classList.remove('cursor-grabbing');
            });
            
            // Touch support
            dial.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].pageX;
            }, {passive: true});
            
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const diff = e.touches[0].pageX - startX;
                if (Math.abs(diff) > 15) {
                    currentPage += diff > 0 ? 1 : -1;
                    pageNumber.textContent = Math.max(1, currentPage);
                    startX = e.touches[0].pageX;
                }
            }, {passive: true});
            
            document.addEventListener('touchend', () => {
                isDragging = false;
            });
        });
    </script>

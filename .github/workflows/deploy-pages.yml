name: Publier BOO-P sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer uniquement les fichiers publics
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.html onboarding.html manifest.webmanifest service-worker.js _site/
          cp -R assets css js stitch_designs _site/
          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
